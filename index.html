<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khu Vườn Cảm Xúc</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* ========================================================
       1. CẤU HÌNH HỆ THỐNG MÀU SẮC & ẢNH NỀN
       ======================================================== */
    :root {
      /* [VỊ TRÍ ĐỔI ẢNH NỀN TRANG CHÍNH SÁNG/TỐI] */
      --bg-day-image: url('day.jpg');
      --bg-night-image: url('night.jpg');

      --palette-dark-navy: #0d3859;
      --palette-ocean-blue: #356d94;
      --palette-soft-cyan: #66c8d7;
      --palette-neon-mint: #41ffd2;

      --day-color-yellow: #fff98a;
      --day-color-forest: #467140;
      --day-color-deep:   #06391d;

      --transition-smooth: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* THEME: BAN NGÀY */
    body.theme-day {
      --current-bg-image: var(--bg-day-image);
      --hero-title-color: #06391d;
      --hero-sub-color: #1e501b;

      --info-section-bg: #f4faed;
      --info-section-card: #ffffff;
      --info-section-title: #06391d;
      --info-section-subtitle: #467140;
      --info-section-text: #224320;
      --info-section-border: rgba(165, 201, 141, 0.5);

      --blog-bg: #f9f9f9;
      --blog-card-bg: #ffffff;
      --blog-text-title: #0f2738;
      --blog-text-desc: #555555;
      
      --header-bg: rgba(255, 255, 255, 0.9);
      --header-border: rgba(165, 201, 141, 0.4);
      --header-text: #06391d;
      --btn-bg: #06391d;
      --btn-text: #ffffff;

      --pinwheel-glow: rgba(255, 235, 100, 0.95);
      --pinwheel-aura: rgba(255, 215, 0, 0.65);
    }

    /* THEME: BAN ĐÊM */
    body.theme-night {
      --current-bg-image: var(--bg-night-image);
      --hero-title-color: #ffffff;
      --hero-sub-color: var(--palette-soft-cyan);

      --info-section-bg: #061825;
      --info-section-card: #0a2335;
      --info-section-title: #ffffff;
      --info-section-subtitle: var(--palette-neon-mint);
      --info-section-text: #c2e2e0;
      --info-section-border: rgba(65, 255, 210, 0.25);

      --blog-bg: #041018;
      --blog-card-bg: #0a2335;
      --blog-text-title: #ffffff;
      --blog-text-desc: #a5c3d4;

      --header-bg: rgba(8, 26, 40, 0.9);
      --header-border: rgba(102, 200, 215, 0.25);
      --header-text: #ffffff;
      --btn-bg: var(--palette-neon-mint);
      --btn-text: var(--palette-dark-navy);

      --pinwheel-glow: rgba(65, 255, 210, 0.95);
      --pinwheel-aura: rgba(102, 200, 215, 0.75);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background: #081d2c;
      color: var(--hero-title-color);
      transition: color 0.6s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ========================================================
       2. THANH ĐIỀU HƯỚNG (HEADER)
       ======================================================== */
    .header {
      position: fixed; top: 0; left: 0; right: 0; height: 70px; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
      background: var(--header-bg); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--header-border); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      transition: var(--transition-smooth);
    }

    .brand-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-slot {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, #a5c98d, var(--palette-neon-mint));
      display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
    }
    .logo-slot img { width: 100%; height: 100%; object-fit: cover; }
    .logo-slot svg { width: 24px; height: 24px; fill: #06391d; }

    .brand-title {
      font-family: 'Playfair Display', serif; font-size: 1.35rem; font-weight: 700;
      color: var(--header-text); transition: color 0.5s ease;
    }

    .nav-actions { display: flex; align-items: center; gap: 16px; }
    .nav-links { display: flex; align-items: center; gap: 8px; list-style: none; }
    .nav-btn {
      background: transparent; border: none; padding: 8px 16px; font-size: 0.95rem;
      font-weight: 500; color: var(--header-text); cursor: pointer; border-radius: 20px;
      transition: var(--transition-smooth); display: inline-flex; align-items: center; gap: 6px;
    }
    .nav-btn:hover { background: rgba(165, 201, 141, 0.28); transform: translateY(-1px); }

    .theme-toggle-header-btn {
      display: inline-flex; align-items: center; gap: 8px; background: var(--btn-bg); color: var(--btn-text);
      border: 1px solid var(--header-border); padding: 8px 18px; border-radius: 30px; cursor: pointer;
      font-size: 0.88rem; font-weight: 600; transition: var(--transition-smooth);
    }
    .theme-toggle-header-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(65, 255, 210, 0.3); }
    .theme-toggle-header-btn svg { width: 17px; height: 17px; fill: currentColor; }

    /* ========================================================
       3. HERO SECTION
       ======================================================== */
    .hero-section {
      /* Dịch chuyển toàn bộ khối tiêu đề lên trên 25px */
      padding-top: calc(15vh - 25px); 
      text-align: center; position: absolute; top: 0; left: 0; right: 0; z-index: 20; pointer-events: none;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 700;
      color: var(--hero-title-color);
      transition: color 0.6s ease;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.5);
      letter-spacing: 1px;
    }

    /* Hiệu ứng ẩn chữ X vào ban ngày để lòi chong chóng ra */
    .missing-x { display: inline-block; transition: var(--transition-smooth); }
    body.theme-day .missing-x { opacity: 0; width: 0.4em; }
    body.theme-night .missing-x { opacity: 1; width: auto; }

    .hero-tagline {
      font-size: clamp(1rem, 2vw, 1.25rem); font-weight: 600; color: var(--hero-sub-color);
      /* Dịch chuyển thẻ p lên trên thêm 35px so với ban đầu (15px -> -20px) */
      margin: -20px auto 0; 
      line-height: 1.5; text-shadow: 0 1px 5px rgba(255, 255, 255, 0.8);
      transition: color 0.6s ease;
    }

    body.theme-night .hero-title { text-shadow: 0 2px 15px rgba(0, 0, 0, 0.8); }
    body.theme-night .hero-tagline { text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8); }

    /* ========================================================
       4. NỀN & VIDEO TRANG CHÍNH
       ======================================================== */
    .hero-stage-container {
      position: relative; width: 100%; margin-top: 70px; height: calc(100vh - 70px); min-height: 620px;
      overflow: hidden; background-color: #071926; background-image: var(--current-bg-image);
      background-size: cover; background-position: center top; transition: background-image 0.8s ease-in-out;
    }
    .video-background-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .main-bg-video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 45%;
      opacity: 0; visibility: hidden; transition: opacity 0.8s, visibility 0.8s; display: block;
    }
    body.theme-day .main-bg-video.video-day { opacity: 1; visibility: visible; }
    body.theme-night .main-bg-video.video-night { opacity: 1; visibility: visible; }
    #atmosphereCanvas { position: absolute; inset: 0; z-index: 5; pointer-events: none; }

    /* CHONG CHÓNG CẢM XÚC GÓC TRÁI */
    .pinwheel-hotspot {
      position: absolute; z-index: 50; cursor: pointer; text-decoration: none;
      display: flex; align-items: center; justify-content: center;
      top: 25%; left: 18%; width: 120px; height: 120px; transform: translate(-50%, -50%);
    }
    .pinwheel-glow-aura {
      position: absolute; inset: -15px; border-radius: 50%;
      background: radial-gradient(circle, var(--pinwheel-aura) 0%, transparent 70%); opacity: 0; transform: scale(0.65); transition: all 0.5s; pointer-events: none;
    }
    .pinwheel-pulse-ring {
      position: absolute; inset: 8px; border-radius: 50%; border: 2px dashed rgba(255, 255, 255, 0.75);
      opacity: 0; animation: spinRing 12s linear infinite; transition: opacity 0.4s ease;
    }
    @keyframes spinRing { 100% { transform: rotate(360deg); } }
    .pinwheel-tooltip {
      position: absolute; bottom: -48px; white-space: nowrap; background: rgba(6, 57, 29, 0.95);
      color: #ffffff; padding: 8px 18px; border-radius: 30px; font-size: 0.95rem; font-weight: 700;
      box-shadow: 0 8px 25px rgba(0,0,0,0.35); border: 1.5px solid var(--palette-neon-mint); display: inline-flex; align-items: center; gap: 8px;
      opacity: 0; transform: translateY(12px) scale(0.9); transition: var(--transition-smooth); pointer-events: none;
    }
    body.theme-night .pinwheel-tooltip { background: rgba(9, 36, 56, 0.95); border-color: var(--palette-neon-mint); }
    .pinwheel-tooltip::before {
      content: ''; position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
      border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 7px solid rgba(6, 57, 29, 0.95);
    }
    body.theme-night .pinwheel-tooltip::before { border-bottom-color: rgba(9, 36, 56, 0.95); }
    .pinwheel-hotspot:hover .pinwheel-glow-aura { opacity: 1; transform: scale(1.35); filter: drop-shadow(0 0 28px var(--pinwheel-glow)); }
    .pinwheel-hotspot:hover .pinwheel-pulse-ring { opacity: 1; }
    .pinwheel-hotspot:hover .pinwheel-tooltip { opacity: 1; transform: translateY(0) scale(1); }

    /* ========================================================
       5. NỘI DUNG DỰ ÁN
       ======================================================== */
    .project-info-section {
      position: relative; z-index: 25; background: var(--info-section-bg); padding: 80px 24px;
      transition: background 0.8s ease; border-top: 1px solid var(--info-section-border);
    }
    .project-info-container { max-width: 860px; margin: 0 auto; text-align: center; }
    .project-badge-pill {
      display: inline-block; padding: 6px 18px; border-radius: 30px; background: rgba(165, 201, 141, 0.25);
      color: var(--info-section-subtitle); font-size: 0.85rem; font-weight: 700; text-transform: uppercase; margin-bottom: 16px; border: 1px solid var(--info-section-border);
    }
    .project-main-title { font-family: 'Playfair Display', serif; font-size: clamp(2.4rem, 4.5vw, 3.4rem); color: var(--info-section-title); font-weight: 700; margin-bottom: 8px; }
    .project-divider { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 16px auto 26px; max-width: 320px; }
    .project-divider-line { flex: 1; height: 1px; background: var(--info-section-border); }
    .project-sub-title { font-family: 'Playfair Display', serif; font-size: 1.7rem; color: var(--info-section-subtitle); font-weight: 600; margin-bottom: 24px; text-transform: capitalize; }
    .project-desc-card {
      background: var(--info-section-card); border: 1px solid var(--info-section-border); border-radius: 28px; padding: 42px 36px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.06); color: var(--info-section-text); font-size: 1.1rem; line-height: 1.9;
    }
    .project-desc-card p + p { margin-top: 18px; }

    /* ========================================================
       6. KHU VỰC BÀI VIẾT & KỸ THUẬT SỨC KHỎE
       ======================================================== */
    .blog-section {
      background: var(--blog-bg);
      padding: 80px 24px 40px;
      transition: background 0.8s ease;
    }
    
    .blog-header {
      text-align: center;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }
    .blog-header-line { width: 40px; height: 1px; background: #ccc; }
    .blog-header h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--blog-text-title);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 35px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .blog-card {
      background: var(--blog-card-bg);
      border-radius: 12px;
      overflow: visible; 
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      border: 1px solid var(--info-section-border);
      display: flex;
      flex-direction: column;
    }
    .blog-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }

    .blog-card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 3px solid var(--palette-neon-mint);
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    /* ========================================================
       THIẾT KẾ HUY HIỆU NGÀY THÁNG (CHONG CHÓNG)
       ======================================================== */
    .blog-date-badge {
      position: absolute;
      /* Dịch chuyển lên góc thẻ card (Tăng kích thước thẻ -> Dịch ra ngoài nhiều hơn) */
      top: -35px;
      left: -35px;
      width: 120px;  /* KÍCH THƯỚC CHONG CHÓNG LỚN HƠN */
      height: 120px;
      background-image: url('chong chóng tách nền.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .blog-card:hover .blog-date-badge {
      transform: rotate(45deg);
    }

    .blog-date-text-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 2px; /* Căn chỉnh nhẹ giữa vòng tròn trắng */
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .blog-card:hover .blog-date-text-wrapper {
      transform: rotate(-45deg);
    }

    /* ĐỊNH DẠNG SỐ VÀ CHỮ TRONG CHONG CHÓNG GIỐNG ẢNH MẪU */
    .blog-date-day { 
      font-size: 1.8rem; /* SỐ TO ĐẬM */
      font-weight: 900; 
      line-height: 0.9; 
      color: #000000; 
    }
    .blog-date-month { 
      font-size: 0.95rem; /* CHỮ NHỎ HƠN */
      font-weight: 500; 
      color: #111111; 
      margin-top: 2px;
    }

    .blog-card-content {
      padding: 24px 20px;
      text-align: center;
      flex: 1;
    }
    .blog-card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--blog-text-title);
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .blog-card-excerpt {
      font-size: 0.95rem;
      color: var(--blog-text-desc);
      line-height: 1.6;
    }

    /* ========================================================
       7. CHÂN TRANG (FOOTER)
       ======================================================== */
    .footer {
      background: var(--header-bg); border-top: 1px solid var(--header-border);
      padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    }
    .copyright { font-size: 0.92rem; color: var(--header-text); font-weight: 500; }
    .audio-footer-btn {
      display: inline-flex; align-items: center; gap: 10px; background: var(--btn-bg); color: var(--btn-text);
      border: 1px solid var(--header-border); padding: 10px 22px; border-radius: 30px; cursor: pointer; font-size: 0.92rem; font-weight: 600;
    }

    /* ========================================================
       8. MODAL ĐỌC BÀI VIẾT (FULL TOÀN MÀN HÌNH)
       ======================================================== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
      z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }

    #articleReadModal .modal-card {
      max-width: 1200px; width: 100%; height: 90vh; padding: 0;
      display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; background: #ffffff;
    }
    body.theme-night #articleReadModal .modal-card { background: #0a1924; border: 1px solid #1a3c54;}

    .article-modal-top {
      height: 60px; background: #f1f5f9; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; border-bottom: 1px solid #e2e8f0;
    }
    body.theme-night .article-modal-top { background: #061118; border-color: #1a3c54;}
    
    .article-modal-brand { font-weight: 700; color: #0d3859; display: flex; align-items: center; gap: 8px;}
    body.theme-night .article-modal-brand { color: #41ffd2; }
    
    .btn-close-article {
      background: #ff4757; color: white; border: none; width: 32px; height: 32px; border-radius: 50%;
      cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center;
    }

    .article-layout { display: flex; flex: 1; overflow-y: auto; }
    .article-main-content { flex: 3; padding: 40px; overflow-y: auto; }
    .article-sidebar {
      flex: 1; min-width: 300px; background: #fafafa; padding: 40px 24px;
      border-left: 1px solid #eee; overflow-y: auto;
    }
    body.theme-night .article-sidebar { background: #040c12; border-color: #1a3c54; }

    .art-category { font-size: 0.85rem; font-weight: 700; color: #7f8c8d; text-transform: uppercase; text-align: center; margin-bottom: 15px; letter-spacing: 2px;}
    .art-title { font-size: 2.2rem; font-weight: 700; color: #111; text-align: center; margin-bottom: 15px; line-height: 1.3;}
    body.theme-night .art-title { color: #fff; }
    .art-meta { font-size: 0.85rem; color: #95a5a6; text-align: center; margin-bottom: 30px;}
    .art-cover { width: 100%; max-height: 450px; object-fit: cover; border-radius: 12px; margin-bottom: 30px;}
    .art-body { font-size: 1.15rem; line-height: 1.8; color: #333; }
    body.theme-night .art-body { color: #ddd; }
    .art-body p { margin-bottom: 20px; }

    /* Sidebar list */
    .sidebar-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; border-bottom: 2px solid #ddd; padding-bottom: 10px; color: #111;}
    body.theme-night .sidebar-title { color: #fff; border-color: #333;}
    .side-post { display: flex; gap: 15px; margin-bottom: 20px; cursor: pointer; }
    .side-post:hover .side-post-title { color: #356d94; }
    .side-date-box { 
      border: 1px solid #2c3e50; padding: 5px; text-align: center; min-width: 50px; height: 50px; 
      display: flex; flex-direction: column; justify-content: center; font-weight: bold; border-radius: 4px; color:#2c3e50;
    }
    body.theme-night .side-date-box { border-color: #66c8d7; color: #66c8d7;}
    .side-date-box span { font-size: 0.7rem; font-weight: normal;}
    .side-post-title { font-size: 0.95rem; line-height: 1.4; color: #222; transition: 0.2s;}
    body.theme-night .side-post-title { color: #ccc; }

    /* Modal Liên hệ nhỏ */
    .modal-card-small {
      background: #fdfefe; width: 100%; max-width: 500px; border-radius: 20px; padding: 30px;
      position: relative; border: 2px solid rgba(165, 201, 141, 0.5);
    }
    body.theme-night .modal-card-small { background: #0a2335; border-color: rgba(65, 255, 210, 0.3);}
    .modal-close-small { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #555;}
    body.theme-night .modal-close-small { color: #ccc;}

    @media (max-width: 900px) {
      .article-layout { flex-direction: column; }
      .article-sidebar { border-left: none; border-top: 1px solid #eee; }
    }
    @media (max-width: 768px) {
      .header { padding: 0 16px; }
      .brand-title { font-size: 1.15rem; }
      .nav-btn span { display: none; }
      .theme-toggle-header-btn span { display: none; }
      .hero-title { font-size: 2.5rem; }
    }
  </style>
</head>
<body class="theme-day">

  <!-- ========================================================
       1. THANH ĐIỀU HƯỚNG
       ======================================================== -->
  <header class="header">
    <a href="#" class="brand-container">
      <div class="logo-slot">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.4z"/></svg>
      </div>
      <h2 class="brand-title">Khu Vườn Cảm Xúc</h2>
    </a>

    <div class="nav-actions">
      <ul class="nav-links">
